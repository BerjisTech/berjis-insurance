<section class="auth-card">
  <header class="auth-card__header">
    <p class="auth-card__eyebrow">Update password</p>
    <h1>Choose a strong password</h1>
    <p class="auth-card__subtitle">Keep your account protected with a unique passphrase.</p>
  </header>

  <form [formGroup]="confirmForm" (ngSubmit)="submit()" novalidate>
    <div class="form-field">
      <label for="token">Reset token</label>
      <input id="token" type="text" formControlName="token" placeholder="Paste your token" required autocomplete="one-time-code" />
    </div>

    <div class="form-field">
      <label for="newPassword">New password</label>
      <input
        id="newPassword"
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
        required
        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}"
      />
      <small class="error" *ngIf="confirmForm.controls.newPassword.hasError('pattern') && confirmForm.controls.newPassword.touched">
        {{ passwordRequirements }}
      </small>
    </div>

    <div class="form-field">
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password" required />
      <small class="error" *ngIf="confirmForm.controls.confirmPassword.touched && confirmForm.value.confirmPassword && confirmForm.value.newPassword !== confirmForm.value.confirmPassword">
        Passwords must match.
      </small>
    </div>

    <div class="auth-card__alerts">
      <p class="error" *ngIf="errorMessage()">{{ errorMessage() }}</p>
      <p class="success" *ngIf="message()">{{ message() }}</p>
    </div>

    <button class="primary-btn" type="submit" [disabled]="loading()">
      <span *ngIf="!loading()">Update password</span>
      <span *ngIf="loading()">Updating...</span>
    </button>
  </form>

  <a routerLink="/auth/login" class="link">Back to login</a>
</section>
