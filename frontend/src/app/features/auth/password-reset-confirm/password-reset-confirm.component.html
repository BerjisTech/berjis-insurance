<section class="auth-card">
  <header class="auth-card__header">
    <p class="auth-card__eyebrow">Update password</p>
    <h1>Choose a strong password</h1>
    <p class="auth-card__subtitle">Keep your account protected with a unique passphrase.</p>
  </header>

  <form [formGroup]="confirmForm" (ngSubmit)="submit()" novalidate>
    <div class="form-field">
      <label for="token">Reset token</label>
      <input id="token" formControlName="token" placeholder="Paste your token" />
    </div>

    <div class="form-field">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" formControlName="newPassword" />
    </div>

    <div class="form-field">
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" />
    </div>

    <div class="auth-card__alerts">
      <p class="error" *ngIf="errorMessage()">{{ errorMessage() }}</p>
      <p class="success" *ngIf="message()">{{ message() }}</p>
    </div>

    <button class="primary-btn" type="submit" [disabled]="loading()">
      <span *ngIf="!loading()">Update password</span>
      <span *ngIf="loading()">Updating…</span>
    </button>
  </form>

  <a routerLink="/auth/login" class="link">Back to login</a>
</section>
