<section class="auth-card">
  <header class="auth-card__header">
    <p class="auth-card__eyebrow">Reset password</p>
    <h1>Need a fresh start?</h1>
    <p class="auth-card__subtitle">We will send a secure link to your email.</p>
  </header>

  <form [formGroup]="requestForm" (ngSubmit)="submit()" novalidate>
    <div class="form-field">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      />
      <small class="error" *ngIf="requestForm.controls.email.invalid && requestForm.controls.email.touched">
        Enter a valid email.
      </small>
    </div>

    <div class="auth-card__alerts">
      <p class="error" *ngIf="errorMessage()">{{ errorMessage() }}</p>
      <p class="success" *ngIf="message()">{{ message() }}</p>
    </div>

    <button class="primary-btn" type="submit" [disabled]="loading()">
      <span *ngIf="!loading()">Send reset link</span>
      <span *ngIf="loading()">Sending...</span>
    </button>
  </form>

  <a routerLink="/auth/login" class="link">Back to login</a>
</section>
