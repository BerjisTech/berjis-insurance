<section class="auth-card">
  <header class="auth-card__header">
    <p class="auth-card__eyebrow">Security check</p>
    <h1>Verify your OTP</h1>
    <p class="auth-card__subtitle">Enter the 6-digit code we sent to your contact.</p>
  </header>

  <form [formGroup]="otpForm" (ngSubmit)="submit()" novalidate>
    <div class="form-field">
      <label for="code">One-Time Password</label>
      <input
        id="code"
        type="tel"
        inputmode="numeric"
        maxlength="6"
        formControlName="code"
        placeholder="123456"
        autocomplete="one-time-code"
        pattern="[0-9]{6}"
        required
        aria-required="true"
      />
      <small class="error" *ngIf="otpForm.controls.code.invalid && otpForm.controls.code.touched">
        Enter the 6-digit code.
      </small>
    </div>

    <div class="auth-card__alerts">
      <p class="error" *ngIf="errorMessage()">{{ errorMessage() }}</p>
      <p class="success" *ngIf="message()">{{ message() }}</p>
    </div>

    <button class="primary-btn" type="submit" [disabled]="loading()">
      <span *ngIf="!loading()">Verify code</span>
      <span *ngIf="loading()">Verifying...</span>
    </button>
  </form>

  <div class="auth-card__links">
    <button
      class="link"
      type="button"
      (click)="resend()"
      [disabled]="loading() || cooldown() > 0"
      aria-live="polite"
    >
      <ng-container *ngIf="cooldown() === 0; else cooldownTimer">Resend code</ng-container>
    </button>
    <ng-template #cooldownTimer>Resend in {{ cooldown() }}s</ng-template>
    <a routerLink="/auth/login" class="link">Back to login</a>
  </div>
</section>
